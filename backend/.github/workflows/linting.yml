name: PINT Linting

on:
  push: 
    branches: [main]
    paths:
      - 'backend/**'
      
jobs: 
  lint:
    runs-on: ubuntu-latest
    defaults:
        run:
          working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - run: composer install --prefer-dist --no-progress --no-interaction
      - run: vendor/bin/pint --test